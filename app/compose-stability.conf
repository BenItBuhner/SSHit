// Classes the Compose compiler may treat as stable though it does not compile them. A class belongs here
// only if it is immutable all the way down: every property a val of a type that is itself immutable. A
// composable taking one is then compared by equals, so an equal copy built during a recomposition
// (resolveLook copies the app's font with the host's own size) no longer re-runs it.

// family: String, sizeSp: Int, lineHeight: Float, and Booleans and Strings besides.
app.berth.domain.model.TerminalFont
