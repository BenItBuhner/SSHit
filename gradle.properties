# Single source of truth for the product identity. Rename here and nowhere else.
app.name=Berth
app.applicationId=app.berth.android
# MAJOR.MINOR.PATCH; the versionCode is derived from it (and from app.versionBuild, which counts re-releases of
# one name and is normally 0) in app/build.gradle.kts, so this is the only place a release is versioned.
app.versionName=0.1.0
app.versionBuild=0

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
